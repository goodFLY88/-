name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04               # use 22.04 for known p4a/toolchain stability
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装系统依赖（包含 autoconf-archive, ant, openjdk-11 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-11-jdk default-jdk ant \
            build-essential autoconf automake libtool libtool-bin m4 pkg-config \
            autoconf-archive \
            python3-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libbz2-dev liblzma-dev libreadline-dev \
            libsqlite3-dev tk-dev uuid-dev

      - name: 装 buildozer、兼容的 sh、并 pin python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # p4a pinned and install a sh version compatible with p4a (p4a 2024.1.21 requires sh<2.0)
          python -m pip install --user "sh<2.0,>=1.10"
          python -m pip install --user --upgrade buildozer
          # pin python-for-android to a stable release (change the version if you need to try other tags)
          python -m pip install --user --upgrade "python-for-android==2024.1.21"

      - name: 编译 APK（清理缓存以强制全新构建）
        working-directory: APK工程
        run: |
          rm -rf .buildozer
          # optionally clear platform folder if you want to force download rebuild:
          # rm -rf ~/.buildozer/android/platform || true
          buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
          if-no-files-found: error
