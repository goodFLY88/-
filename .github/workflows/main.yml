name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取官方 buildozer 镜像
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: 用官方镜像打包 APK（首次跑通到 pyjnius 失败后 patch 再续）
        run: |
          docker run --rm --entrypoint bash \
            -v ${{ github.workspace }}:/project \
            -w /project/APK工程 \
            ghcr.io/kivy/buildozer:latest \
            -c '
              set -x
              git config --global --add safe.directory "*"

              # 第一次跑：buildozer 会 clone p4a、解压 pyjnius，到 setup.py 顶层 javac 处失败
              buildozer -v android debug || true

              # patch 解压出来的 pyjnius setup.py：注释掉顶层桌面专用 javac 调用
              SETUP_PY=$(find .buildozer -path "*pyjnius*/setup.py" | head -1)
              echo "=== patching $SETUP_PY ==="
              sed -i "s/^compile_native_invocation_handler(JAVA)/# p4a: disabled desktop-only javac call/" "$SETUP_PY"
              grep -n "compile_native_invocation_handler" "$SETUP_PY"

              # 第二次跑：buildozer 复用已解压源码，继续编译
              buildozer -v android debug
            '

      - name: 修复产物权限
        run: sudo chmod -R 777 "APK工程/bin" || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
