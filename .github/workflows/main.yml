name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf automake libtool libtool-bin m4 pkg-config \
            python3-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libbz2-dev liblzma-dev libreadline-dev \
            libsqlite3-dev tk-dev uuid-dev

    - name: 装 buildozer
  run: |
    python -m pip install --upgrade pip setuptools wheel
    python -m pip install --user --upgrade buildozer
    python -m pip install --user --upgrade "python-for-android==2024.01.21"

- name: 编译 APK
  working-directory: APK工程
  run: |
    rm -rf .buildozer
    buildozer -v android debug

      - name: 编译 APK
        working-directory: APK工程
        run: buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
          if-no-files-found: error
