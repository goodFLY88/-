name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04        # use 22.04 to avoid newer-runner autoconf/libtool issues
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            build-essential autoconf automake libtool libtool-bin m4 pkg-config \
            autoconf-archive \
            python3-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libbz2-dev liblzma-dev libreadline-dev \
            libsqlite3-dev tk-dev uuid-dev

      - name: 装 buildozer 和 固定 p4a 及兼容 sh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # install a compatible sh version (p4a requires sh < 2.0)
          python -m pip install --user "sh<2.0,>=1.10"
          python -m pip install --user --upgrade buildozer
          # pin python-for-android to a stable release
          python -m pip install --user --upgrade "python-for-android==2024.1.21"

      - name: 编译 APK
        working-directory: APK工程
        run: |
          # ensure a clean build (remove any cached builds / hostpython)
          rm -rf .buildozer
          buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
          if-no-files-found: error
