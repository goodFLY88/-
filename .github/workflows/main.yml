name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取官方 buildozer 镜像
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: 准备并 patch p4a
        run: |
          P4A="APK工程/.buildozer/android/platform/python-for-android"
          mkdir -p "$P4A"
          git clone --depth 1 -b v2026.05.09 https://github.com/kivy/python-for-android.git "$P4A"

          echo '' | base64 -d > "$P4A/pythonforandroid/recipes/pyjnius/no_desktop_javac.patch"

          sed -i 's|    patches = \[|    patches = [\n        "no_desktop_javac.patch",|' "$P4A/pythonforandroid/recipes/pyjnius/__init__.py"

          echo "=== patch 文件内容 ==="
          cat "$P4A/pythonforandroid/recipes/pyjnius/no_desktop_javac.patch"
          echo "=== recipe patches 列表 ==="
          grep -A6 "patches = \[" "$P4A/pythonforandroid/recipes/pyjnius/__init__.py"

      - name: 用官方镜像打包 APK
        run: |
          docker run --rm --entrypoint bash \
            -v ${{ github.workspace }}:/project \
            -w /project/APK工程 \
            ghcr.io/kivy/buildozer:latest \
            -c "buildozer -v android debug"

      - name: 修复产物权限
        run: sudo chmod -R 777 "APK工程/bin" || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
