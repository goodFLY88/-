name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
      - name: 安装 buildozer
        run: |
          pip3 install --user --upgrade buildozer==1.6.0 Cython==0.29.36
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: 打包 APK
        working-directory: APK工程
        run: buildozer -v android debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
