name: 打包APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取官方 buildozer 镜像
        run: docker pull ghcr.io/kivy/buildozer:latest

      # 优化版:直接在仓库根目录打包(单一代码源),不再切到 APK工程/
      # 注意:管道加 set -o pipefail,否则 tee 会吞掉 docker 的失败退出码(又一个假绿来源)
      # 绕开 GitHub 下载 Gradle 的 504 / 超时问题（曾连续 6 次重试全卡在这一步）
      # 宿主机网络比容器内宽裕，用国内镜像先拉好，容器里让 wrapper 读本地文件
      - name: 预下载 Gradle 发行包（国内镜像）
        shell: bash
        run: |
          set -e
          URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-all.zip"
          )
          for U in "${URLS[@]}"; do
            echo "尝试下载: $U"
            if curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 600 \
                -o gradle-8.14.3-all.zip "$U"; then
              if unzip -tq gradle-8.14.3-all.zip >/dev/null 2>&1; then
                echo "Gradle 已就绪: $(du -h gradle-8.14.3-all.zip | cut -f1)"
                exit 0
              fi
              echo "压缩包校验失败，换下一个源"
            fi
          done
          echo "Gradle 预下载全部失败"
          exit 1

      - name: 用官方镜像打包 APK（首次跑通到 pyjnius 失败后 patch 再续）
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --entrypoint bash \
            -v ${{ github.workspace }}:/project \
            -w /project \
            ghcr.io/kivy/buildozer:latest \
            -c '
              set -x
              git config --global --add safe.directory "*"

              # gradle wrapper 指向本地预下载包，避免从 GitHub 现下（504/超时）
              patch_gradle() {
                find /project/.buildozer -name gradle-wrapper.properties 2>/dev/null | while read -r F; do
                  sed -i "s|^distributionUrl=.*|distributionUrl=file\\:/project/gradle-8.14.3-all.zip|" "$F"
                done
                echo "gradle-wrapper.properties patched:"
                find /project/.buildozer -name gradle-wrapper.properties -exec grep -H distributionUrl {} \; 2>/dev/null || true
              }
              patch_gradle

              # 循环：每次失败后 patch，再重试
              for i in 1 2 3 4 5 6; do
                echo "=== build attempt $i ==="
                patch_gradle
                # yes | : 新版 buildozer 检测到 root 会交互询问
                # "Are you sure you want to continue [y/n]?",CI 无 stdin 时会
                # EOFError 崩溃(假绿元凶),这里用 yes 喂 y
                if yes | buildozer -v android debug; then
                  echo "=== build succeeded ==="
                  break
                fi
                echo "=== patching ==="
                # 1) sed 所有架构的 pyjnius setup.py，去掉顶层桌面 javac
                find .buildozer -path "*pyjnius*/setup.py" 2>/dev/null | while read -r SETUP_PY; do
                  sed -i "s/^compile_native_invocation_handler(JAVA)/# p4a: disabled desktop-only javac call/" "$SETUP_PY"
                done
                # 2) 删除损坏的 build venv（Python 3.14 ensurepip 旧 pip 不兼容）
                rm -rf .buildozer/android/platform/build-*/build/venv 2>/dev/null || true
                # 3) patch p4a: 创建 venv 时加 --upgrade-deps 装新 pip
                P4A_DIR=".buildozer/android/platform/python-for-android"
                find "$P4A_DIR" -name "*.py" -exec sed -i "s/-m venv venv/-m venv venv --upgrade-deps/g" {} \; 2>/dev/null || true
              done

              # 产物校验:没有 APK 就非零退出,让 Job 真正失败(杜绝假绿)
              ls -l bin/*.apk
            ' 2>&1 | tee build.log

      - name: 上传构建日志（无论成败，失败时这是唯一定位手段）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 修复产物权限
        run: sudo chmod -R 777 bin

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: bin/*.apk
          if-no-files-found: error
