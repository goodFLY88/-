name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 编译 APK
        working-directory: APK工程
        run: buildozer -v android debug
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
