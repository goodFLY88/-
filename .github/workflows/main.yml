name: 打包APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取官方 buildozer 镜像
        run: docker pull ghcr.io/kivy/buildozer:latest

      - name: 用官方镜像打包 APK（首次跑通到 pyjnius 失败后 patch 再续）
        run: |
          docker run --rm --entrypoint bash \
            -v ${{ github.workspace }}:/project \
            -w /project/APK工程 \
            ghcr.io/kivy/buildozer:latest \
            -c '
              set -x
              git config --global --add safe.directory "*"

              # 循环：每次失败后 sed patch 所有已解压的 pyjnius setup.py，再重试
              for i in 1 2 3 4 5; do
                echo "=== build attempt $i ==="
                if buildozer -v android debug; then
                  echo "=== build succeeded ==="
                  break
                fi
                echo "=== patching all pyjnius setup.py ==="
                find .buildozer -path "*pyjnius*/setup.py" | while read -r SETUP_PY; do
                  echo "--- patching $SETUP_PY ---"
                  sed -i "s/^compile_native_invocation_handler(JAVA)/# p4a: disabled desktop-only javac call/" "$SETUP_PY"
                  grep -n "compile_native_invocation_handler" "$SETUP_PY" || true
                done
              done
            '

      - name: 修复产物权限
        run: sudo chmod -R 777 "APK工程/bin" || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ICVE刷课APK
          path: APK工程/bin/*.apk
